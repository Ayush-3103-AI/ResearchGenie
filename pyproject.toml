[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "researchgenie"
version = "0.1.0"
description = "A local-first AI research assistant: literature discovery, evidence-grounded drafting, citation verification, and quality assurance, running on your own machine."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "pypdf>=4.0.0",
    "defusedxml>=0.7.1",
    "PyYAML>=6.0,<7.0",
    "langgraph>=1.0,<2.0",
    "langgraph-checkpoint-sqlite>=3.0,<4.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]

[project.scripts]
researchgenie = "researchgenie.cli:main"
researchgenie-advise = "researchgenie.advisor_cli:main"
researchgenie-dev = "dev_agent.agent:main"

[tool.setuptools]
# The pipeline's own service modules (services/research-discovery, etc.)
# are not standard importable Python packages — each has a hyphenated
# directory name and is loaded at runtime via importlib.util file-path
# loading (see orchestrator/pipeline.py::_load_service()), the same
# pattern used throughout local development. Renaming those directories
# into valid package names would be a much larger, riskier restructuring
# of already-tested services than this packaging pass calls for, so
# instead every source directory the CLI needs at runtime ships as package
# data alongside the real `researchgenie` package, preserving the exact
# file layout the existing file-path loading already expects.
packages = ["researchgenie", "orchestrator", "shared", "services", "dev_agent"]

[tool.setuptools.package-data]
researchgenie = ["*"]
orchestrator = ["*"]
shared = ["**/*"]
services = ["**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.pyc"]
