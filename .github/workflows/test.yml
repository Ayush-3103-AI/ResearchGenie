name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/base.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt
          pip install -e . pytest

      # No Ollama on the runner, so the live-model tests skip on their own
      # reachability check; the full-pipeline test stays opt-in
      # (AI_RESEARCH_RUN_FULL_PIPELINE unset); live-network tests skip on CI.
      - name: Run fast test suite
        run: python -m pytest -q -rs
